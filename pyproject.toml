[project]
name = "dataqg"
version = "0.1.0"
description = "A command-line quality gate for CSV datasets."
readme = "README.md"
authors = [{ name = "Alphonce Mukavhi", email = "alphoncemukavhi@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dataqg = "dataqg.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataqg"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
